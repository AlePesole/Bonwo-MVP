services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bonwoapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bonwoapp}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-user123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-bonwoapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
